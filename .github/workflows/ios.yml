name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "TestFlight에 올리기"
        type: boolean
        default: true
      shots:
        description: "시뮬레이터 화면 캡처 (암호화해서 올림)"
        type: boolean
        default: false
      shotset:
        description: "캡처 묶음 (all = 탭·지도 전부, daymap = 날짜별 위치 원본 지도만)"
        type: string
        default: all

env:
  NAVER_MAP_KEY_ID: ${{ secrets.NAVER_MAP_KEY_ID }}
  GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app; sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -viE "beta|_RC" | sort -V | tail -1)"
          xcodebuild -version
      - name: 빌드 (시뮬레이터, 서명 없음)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project LocationLog.xcodeproj -scheme LocationLog \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO NAVER_MAP_KEY_ID="$NAVER_MAP_KEY_ID" GOOGLE_MAPS_KEY="$GOOGLE_MAPS_KEY" build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

  shots:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.shots
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -viE "beta|_RC" | sort -V | tail -1)"
      - name: 빌드 (시뮬레이터)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project LocationLog.xcodeproj -scheme LocationLog -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath $RUNNER_TEMP/dd CODE_SIGNING_ALLOWED=NO NAVER_MAP_KEY_ID="$NAVER_MAP_KEY_ID" GOOGLE_MAPS_KEY="$GOOGLE_MAPS_KEY" build | tail -3
      - name: 캡처
        env:
          TOKEN: ${{ secrets.SILLAGE_APP_TOKEN }}
          SHOTSET: ${{ inputs.shotset }}
        run: |
          APP=$(ls -d $RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          BID=kr.b-612.sillage
          mkdir -p shots
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20
          for DEV in "iPhone 17 Pro" "iPad Pro 13-inch (M5)" "iPad Air 11-inch (M3)"; do
            UDID=$(xcrun simctl list devices available | grep -F "$DEV (" | head -1 | grep -oE '[0-9A-F-]{36}') || true
            [ -z "$UDID" ] && continue
            xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b >/dev/null
            xcrun simctl install $UDID "$APP"
            xcrun simctl privacy $UDID grant location-always $BID || true
            xcrun simctl privacy $UDID grant motion $BID || true
            xcrun simctl location $UDID set 37.5472,126.9317 || true
            for MP in naver google apple; do
              xcrun simctl ui $UDID appearance light
              xcrun simctl terminate $UDID $BID 2>/dev/null || true
              xcrun simctl launch $UDID $BID -shotToken "$TOKEN" -tab settings -shotDayMap 2026-11-10 -mapProvider $MP >/dev/null
              sleep 4
              xcrun simctl io $UDID screenshot "shots/${DEV// /_}-daymap-$MP-4s.png" >/dev/null
              sleep 8
              xcrun simctl io $UDID screenshot "shots/${DEV// /_}-daymap-$MP-12s.png" >/dev/null
            done
            if [ "$SHOTSET" = "daymap" ]; then xcrun simctl shutdown $UDID; continue; fi
            for MODE in light dark; do
              xcrun simctl ui $UDID appearance $MODE
              for TAB in timeline autoCheckin record settings; do
                xcrun simctl terminate $UDID $BID 2>/dev/null || true
                xcrun simctl launch $UDID $BID -shotToken "$TOKEN" -shotDay 2026-11-09 -tab $TAB >/dev/null
                sleep 9
                xcrun simctl io $UDID screenshot "shots/${DEV// /_}-$MODE-$TAB.png" >/dev/null
              done
            done
            for MODE in light dark; do
              xcrun simctl ui $UDID appearance $MODE
              for MP in naver google apple; do
                xcrun simctl terminate $UDID $BID 2>/dev/null || true
                xcrun simctl launch $UDID $BID -shotToken "$TOKEN" -shotDay 2026-11-09 -tab timeline -mapProvider $MP >/dev/null
                sleep 12
                xcrun simctl io $UDID screenshot "shots/${DEV// /_}-map-$MP-$MODE.png" >/dev/null
              done
            done
            xcrun simctl shutdown $UDID
          done
          ls shots
          tar czf - shots | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:TOKEN -out shots.tgz.enc
      - uses: actions/upload-artifact@v4
        with:
          name: shots-encrypted
          path: shots.tgz.enc
          retention-days: 1

  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: ls -d /Applications/Xcode*.app; sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -viE "beta|_RC" | sort -V | tail -1)"
      - name: API 키
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: 아카이브 (자동 서명)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project LocationLog.xcodeproj -scheme LocationLog -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/LocationLog.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            NAVER_MAP_KEY_ID="$NAVER_MAP_KEY_ID" GOOGLE_MAPS_KEY="$GOOGLE_MAPS_KEY" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: IPA 만들기
        working-directory: ios
        run: |
          cat > $RUNNER_TEMP/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/LocationLog.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID
          ls -la $RUNNER_TEMP/export
      - name: App Store Connect 앱 목록 (진단)
        continue-on-error: true
        run: xcrun altool --list-apps --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER_ID 2>&1 | head -40
      - name: TestFlight 업로드
        run: |
          xcrun altool --upload-app -t ios -f "$(ls $RUNNER_TEMP/export/*.ipa | head -1)" \
            --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER_ID --show-progress
