<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="위치 기록">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<title>위치 기록</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --card: #12161ee6; --line: #ffffff1f; --dim: #94a3b8; --rec: #ef4444; --est: #f59e0b; --ok: #22c55e;
    --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #e8ecf3; overflow: hidden;
    font-family: -apple-system, "Pretendard", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  button { appearance: none; border: 0; font: inherit; color: inherit; background: none; touch-action: manipulation; cursor: pointer; }
  [hidden] { display: none !important; }

  /* 지도 모드 */
  #mapWrap { position: fixed; inset: 0; background: #1b2230; }
  #mapWrap > #map { position: absolute !important; inset: 0; }
  #overlay { position: fixed; left: 10px; right: 10px; top: calc(var(--safe-t) + 10px); z-index: 10; pointer-events: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 4px 7px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .ov-row { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .ov-cell { text-align: center; padding: 2px 10px; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .ov-cell + .ov-cell { border-left: 1px solid var(--line); }
  .ov-lbl { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
  .ov-val { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 30px; white-space: nowrap; }
  .ov-val small { font-size: 11px; font-weight: 600; color: var(--dim); margin-left: 3px; }
  .ov-dir { display: flex; align-items: center; gap: 6px; height: 30px; }
  .ov-dir svg { width: 30px; height: 30px; flex: none; }
  .ov-dir span { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .g-ring { fill: #ffffff0d; stroke: #ffffff40; stroke-width: 1.5; }
  .g-tick { stroke: #ffffff55; stroke-width: 1.5; }
  .g-n { fill: #f87171; font-size: 7px; font-weight: 800; text-anchor: middle; }
  #dirNeedle { transition: transform .4s ease-out; transform-origin: 20px 20px; }
  .g-needle { fill: #60a5fa; }
  .g-off #dirNeedle { opacity: .25; }
  #ovStatus { text-align: center; font-size: 12px; color: var(--dim); margin-top: 5px; font-variant-numeric: tabular-nums; }
  #ovStatus .est { color: var(--est); font-weight: 700; }
  #ovStatus .ok { color: var(--ok); font-weight: 700; }
  #btnFollow { position: fixed; right: 12px; z-index: 10; width: 44px; height: 44px; border-radius: 22px; background: var(--card); border: 1px solid var(--line);
    font-size: 20px; top: calc(var(--safe-t) + 112px); }
  #btnFollow.on { color: #60a5fa; }
  .me { position: relative; width: 40px; height: 40px; }
  .me-dot { position: absolute; left: 12px; top: 12px; width: 16px; height: 16px; border-radius: 8px; background: #3b82f6; border: 3px solid #fff; box-shadow: 0 0 0 6px #3b82f633; }
  .me-arrow { position: absolute; left: 0; top: 0; width: 40px; height: 40px; }
  .me-arrow::before { content: ""; position: absolute; left: 14px; top: -3px; border: 6px solid transparent; border-bottom: 10px solid #3b82f6; }

  /* 기록 모드 */
  #log { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; padding-top: var(--safe-t); }
  #logHead { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); background: #0f131a; }
  .lh-top { display: flex; align-items: center; gap: 8px; }
  .lh-dot { width: 10px; height: 10px; border-radius: 5px; background: var(--rec); animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #lhState { font-size: 15px; font-weight: 700; }
  #lhTime { margin-left: auto; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lh-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .lh-stats > div { background: #ffffff0a; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; }
  .lh-stats b { font-size: 19px; font-variant-numeric: tabular-nums; }
  .lh-stats small { font-size: 11px; color: var(--dim); margin-left: 3px; font-weight: 600; }
  .lh-stats span { display: block; font-size: 11px; color: var(--dim); margin-top: 1px; }
  #lhStatus { font-size: 12px; color: var(--dim); margin-top: 8px; }
  #lhStatus .est { color: var(--est); font-weight: 700; }
  #lhStatus .ok { color: var(--ok); font-weight: 700; }
  .lh-cols, #logList .ln { display: grid; grid-template-columns: 70px 1fr 64px; gap: 8px; align-items: center; }
  .lh-cols { padding: 7px 16px; font-size: 11px; color: var(--dim); border-bottom: 1px solid var(--line); }
  .lh-cols span:last-child, #logList .s { text-align: right; }
  #logList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 0 calc(var(--safe-b) + 110px);
    font-size: 14px; font-variant-numeric: tabular-nums; user-select: text; -webkit-user-select: text; }
  #logList .ln { padding: 8px 16px; border-bottom: 1px solid #ffffff0d; }
  #logList .ln:last-child { background: #3b82f61a; }
  #logList .t { color: var(--dim); }
  #logList .c { white-space: nowrap; overflow: hidden; text-overflow: clip; letter-spacing: -.01em; }
  #logList .s { color: #cbd5e1; white-space: nowrap; }
  #logList .s small { color: var(--dim); font-size: 10px; margin-left: 2px; }
  #logList .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 5px; margin-left: 6px; vertical-align: 1px; }
  #logList .tag.est { background: #f59e0b26; color: #fbbf24; }
  #logList .ln.est-ln .c { color: #fcd34d; }
  #logList .gap { display: block; text-align: center; color: #64748b; font-size: 12px; padding: 8px 16px; border-bottom: 1px solid #ffffff0d; }
  #logIdle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--dim); padding-bottom: 120px; }
  #logIdle .ic { width: 64px; height: 64px; border-radius: 32px; border: 2px solid #ffffff26; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  #logIdle b { color: #e8ecf3; font-size: 18px; }
  #logIdle p { margin: 0; font-size: 14px; text-align: center; line-height: 1.5; }
  /* 하단 */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px calc(var(--safe-b) + 18px); pointer-events: none; }
  #bottom > * { pointer-events: auto; }
  .small { width: 46px; height: 46px; border-radius: 23px; background: var(--card); border: 1px solid var(--line); font-size: 20px;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #btnRec { min-width: 172px; height: 64px; border-radius: 32px; font-size: 19px; font-weight: 700; background: #2563eb; box-shadow: 0 6px 20px #0008; }
  #btnRec.on { background: var(--rec); }
  #sensorBanner { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 96px); z-index: 21; background: #78350f;
    color: #fde68a; border-radius: 12px; padding: 9px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }

  /* 설정 */
  #settings { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
  .s-head { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--safe-t) + 10px) 16px 10px; border-bottom: 1px solid var(--line); }
  .s-head h2 { margin: 0; font-size: 19px; }
  .s-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px calc(var(--safe-b) + 24px); }
  .s-sec { color: var(--dim); font-size: 13px; margin: 18px 0 6px; }
  .trk { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .trk-name { font-size: 16px; font-weight: 600; word-break: break-all; }
  .trk-meta { font-size: 13px; color: var(--dim); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .trk-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .trk-acts button { font-size: 13px; padding: 6px 10px; border-radius: 9px; background: #ffffff14; }
  .trk-acts button.del { color: #fca5a5; }
  .trk-acts button:disabled { opacity: .45; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; background: #ffffff14; color: var(--dim); font-weight: 600; }
  .badge.rec { background: #ef444433; color: #fca5a5; }
  .badge.sent { background: #22c55e2a; color: #86efac; }
  .s-empty { color: var(--dim); padding: 24px 0; text-align: center; }
  .s-link { display: block; color: var(--dim); font-size: 13px; padding: 14px 0; text-decoration: none; }
  .x { font-size: 22px; width: 40px; height: 40px; }
  .rename { display: flex; gap: 6px; margin-top: 8px; }
  .rename input { flex: 1; font-size: 16px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: #0f141c; color: inherit; min-width: 0; }
  .rename button { padding: 8px 12px; border-radius: 9px; background: #2563eb; font-size: 14px; font-weight: 600; }

  /* 경로 보기 */
  #detail { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
  #detailWrap { flex: 1; position: relative; min-height: 0; }
  #detailWrap > #detailMap { position: absolute !important; inset: 0; }
  #detailInfo { padding: 10px 16px calc(var(--safe-b) + 14px); font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); }
  #toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 96px); transform: translateX(-50%); z-index: 80; background: #111827f2; border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; text-align: center; }
</style>
</head>
<body>
<!-- 지도 모드 -->
<section id="mapMode">
  <div id="mapWrap"><div id="map"></div></div>
  <div id="overlay">
    <div class="ov-row">
      <div class="ov-cell"><div class="ov-lbl">속도</div><div class="ov-val" id="ovSpeed">–<small>km/h</small></div></div>
      <div class="ov-cell"><div class="ov-lbl">방향</div><div class="ov-dir g-off" id="dirBox">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" class="g-ring"/>
          <line x1="20" y1="3" x2="20" y2="6.5" class="g-tick"/><line x1="37" y1="20" x2="33.5" y2="20" class="g-tick"/>
          <line x1="20" y1="37" x2="20" y2="33.5" class="g-tick"/><line x1="3" y1="20" x2="6.5" y2="20" class="g-tick"/>
          <text x="20" y="12.5" class="g-n">N</text>
          <g id="dirNeedle"><path d="M20 8 L25.5 26 L20 22.5 L14.5 26 Z" class="g-needle"/></g></svg>
        <span id="ovDir">–</span></div></div>
      <div class="ov-cell"><div class="ov-lbl">기록 시간</div><div class="ov-val" id="ovTime">–</div></div>
    </div>
    <div id="ovStatus">위치 확인 중…</div>
  </div>
  <button id="btnFollow" class="on" aria-label="내 위치 따라가기">◎</button>
</section>

<!-- 기록 모드 -->
<section id="logMode" hidden>
  <div id="log">
    <header id="logHead">
      <div class="lh-top"><span class="lh-dot"></span><span id="lhState">기록 중</span><span id="lhTime">00:00:00</span></div>
      <div class="lh-stats">
        <div><b id="lhDist">0.0</b><small>km</small><span>거리</span></div>
        <div><b id="lhSpd">–</b><small>km/h</small><span>속도</span></div>
        <div><b id="lhPts">0</b><small>개</small><span>기록한 위치</span></div>
      </div>
      <div id="lhStatus"></div>
    </header>
    <div class="lh-cols" id="logCols"><span>시각</span><span>위도, 경도</span><span>속도</span></div>
    <div id="logList"></div>
    <div id="logIdle"><div class="ic">📍</div><b>기록 중이 아닙니다</b><p>아래 <b style="font-size:14px">● 기록 시작</b>을 누르면<br>위치가 여기에 시간순으로 쌓입니다</p></div>
  </div>
</section>

<div id="bottom">
  <button class="small" id="btnMode" aria-label="화면 전환">📝</button>
  <button id="btnRec">● 기록 시작</button>
  <button class="small" id="btnSet" aria-label="설정">⚙</button>
</div>
<button id="sensorBanner" hidden>터널 보정용 센서 켜기</button>

<!-- 설정 -->
<section id="settings" hidden>
  <div class="s-head"><h2>설정</h2><button class="x" id="btnSetClose" aria-label="닫기">✕</button></div>
  <div class="s-body">
    <div class="s-sec">저장된 기록</div>
    <div id="trkList"><div class="s-empty">불러오는 중…</div></div>
    <a class="s-link" href="lab/">센서 실험실 (3D 자세·궤적) ›</a>
  </div>
</section>

<section id="detail" hidden>
  <div class="s-head"><h2 id="detailTitle">경로</h2><button class="x" id="btnDetailClose" aria-label="닫기">✕</button></div>
  <div id="detailWrap"><div id="detailMap"></div></div>
  <div id="detailInfo"></div>
</section>

<div id="toast" hidden></div>

<script type="module" src="app.js?v=11"></script>
</body>
</html>
