name: FloorInteraction
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  LocationLog:
    type: application
    platform: iOS
    sources: [../LocationLog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.b-612.sillage
        INFOPLIST_FILE: ../Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.11.2"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LevelPickerTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [../UITests]
    dependencies:
      - target: LocationLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.b-612.sillage.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LocationLog
schemes:
  FloorInteraction:
    build:
      targets:
        LocationLog: all
    test:
      targets: [LevelPickerTests]
