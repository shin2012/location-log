# 예비용: Xcode 프로젝트가 안 열리면  brew install xcodegen && cd ios && xcodegen
name: LocationLog
options:
  bundleIdPrefix: kr.b-612
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
packages:
  NMapsMap:
    url: https://github.com/navermaps/SPM-NMapsMap
    from: 3.24.1
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 11.0.0
targets:
  LocationLog:
    type: application
    platform: iOS
    sources: [LocationLog]
    dependencies:
      - package: NMapsMap
      - package: GoogleMaps
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Sillage
        NSLocationWhenInUseUsageDescription: 이동 경로를 기록하려면 위치가 필요합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 화면이 꺼져 있거나 다른 앱을 쓰는 동안에도 이동 경로를 계속 기록하려면 '항상 허용'이 필요합니다. '하루 종일 기록'에도 씁니다.
        UIBackgroundModes: [location]
        NMFNcpKeyId: $(NAVER_MAP_KEY_ID)
        GMSApiKey: $(GOOGLE_MAPS_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.b-612.sillage
        NAVER_MAP_KEY_ID: ""
        GOOGLE_MAPS_KEY: ""
        MARKETING_VERSION: "1.6.2"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/LocationLog.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
