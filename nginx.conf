server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 60m;
  location /api/ {
    proxy_pass http://location-api:8000;
    proxy_read_timeout 60s;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), magnetometer=(self)";
  }
}
