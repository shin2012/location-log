server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 60m;
  location /api/ {
    proxy_pass http://location-api:8000;
    proxy_set_header X-App-Gate "";
    proxy_read_timeout 60s;
  }
  # 네이티브 앱용: 로그인 없이 들어오므로 api 서버가 Bearer 토큰을 검사
  location /app-api/ {
    proxy_pass http://location-api:8000/api/;
    proxy_set_header X-App-Gate 1;
    proxy_read_timeout 60s;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), magnetometer=(self)";
  }
}
