services:
  web:
    image: nginx:alpine
    container_name: location-web
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [npm_network]
    depends_on: [api]
  api:
    build: ./server
    image: location-api:latest
    container_name: location-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./logs:/data
    networks: [npm_network]

networks:
  npm_network:
    external: true
